# RootLens Operator - Build, Test, and Release
name: Operator Build, Test & Release

on:
  push:
    branches: [main]
    paths:
      - 'operator/**'
      - '.github/workflows/operator.yml'
  pull_request:
    branches: [main]
    paths:
      - 'operator/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push Docker images'
        required: false
        default: 'false'
        type: boolean
      push_helm:
        description: 'Push Helm chart'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rootlens-operator
  HELM_REPO: ${{ github.repository_owner }}/charts
  GO_VERSION: '1.25'

jobs:
  # Lint and Test
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: operator/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.64.8
          working-directory: operator
          args: --timeout=5m

      - name: Run tests
        working-directory: operator
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: operator/cover.out
          flags: operator
          fail_ci_if_error: false

  # Build Docker Image
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./operator
          file: ./operator/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

  # Helm Chart
  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Update chart version
        if: github.event_name == 'release'
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present

          # Update Chart.yaml
          sed -i "s/^version:.*/version: ${VERSION}/" operator/helm/rootlens-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" operator/helm/rootlens-operator/Chart.yaml

          # Update default image tag in values.yaml
          sed -i "s/tag: \"latest\"/tag: \"${VERSION}\"/" operator/helm/rootlens-operator/values.yaml

      - name: Lint chart
        run: helm lint operator/helm/rootlens-operator

      - name: Package chart
        run: |
          helm package operator/helm/rootlens-operator -d .helm-packages
          ls -la .helm-packages/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to OCI registry
        if: github.event_name == 'release' || inputs.push_helm == 'true'
        run: |
          helm push .helm-packages/*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: .helm-packages/*.tgz

  # E2E Tests (Optional)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kind
        uses: helm/kind-action@v1
        with:
          cluster_name: rootlens-test

      - name: Install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm install keda kedacore/keda --namespace keda --create-namespace --wait

      - name: Install operator
        run: |
          # Install CRDs
          kubectl apply -f operator/config/crd/bases/

          # Deploy operator using Helm
          helm install rootlens-operator operator/helm/rootlens-operator \
            --namespace rootlens-system \
            --create-namespace \
            --set operator.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set operator.image.tag=${{ needs.build.outputs.image_tag }} \
            --wait --timeout 120s

      - name: Verify operator running
        run: |
          kubectl wait --for=condition=available deployment/rootlens-operator \
            -n rootlens-system --timeout=60s
          kubectl get pods -n rootlens-system

      - name: Create test RootLens instance
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: rca.rootlens.io/v1alpha1
          kind: RootLens
          metadata:
            name: test-rootlens
            namespace: rootlens-system
          spec:
            components:
              api:
                replicas: 1
                image: nginx:alpine  # Placeholder for testing
              mlService:
                enabled: false
              dashboard:
                enabled: false
              consumer:
                enabled: false
              internalRabbitMQ:
                enabled: false
            scaling:
              enabled: false
          EOF

      - name: Wait for reconciliation
        run: |
          sleep 30
          kubectl get rootlens -n rootlens-system
          kubectl describe rootlens test-rootlens -n rootlens-system

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Operator logs ==="
          kubectl logs -n rootlens-system -l control-plane=controller-manager --tail=100
          echo "=== Events ==="
          kubectl get events -n rootlens-system --sort-by='.lastTimestamp'

  # Release Summary
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [build, helm]
    if: github.event_name == 'release'

    steps:
      - name: Create summary
        run: |
          echo "## RootLens Operator Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Helm Chart" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "helm install rootlens-operator oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/rootlens-operator --version ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Start" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Install operator" >> $GITHUB_STEP_SUMMARY
          echo "helm install rootlens-operator oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/rootlens-operator \\" >> $GITHUB_STEP_SUMMARY
          echo "  --namespace rootlens-system --create-namespace" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Create RootLens instance" >> $GITHUB_STEP_SUMMARY
          echo "kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/operator/config/samples/rca_v1alpha1_rootlens.yaml" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
