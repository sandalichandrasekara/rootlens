apiVersion: v1
kind: ConfigMap
metadata:
  name: rootlens-config
  namespace: default
  labels:
    app: rootlens
data:
  RABBITMQ_HOST: "rabbitmq.rabbitmq.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "admin"
  RABBITMQ_QUEUE: "rootlens-tasks"
  ML_SERVICE_URL: "http://ml-service.default.svc.cluster.local:5000"
  ALLOWED_ORIGIN: "*"
