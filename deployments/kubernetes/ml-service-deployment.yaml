# LOCAL DEV ONLY — uses locally built images (minikube).
# For production, use the operator: operator/config/samples/rca_v1alpha1_rootlens_ghcr.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: default
  labels:
    app: ml-service
    component: rootlens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
        component: rootlens
    spec:
      containers:
      - name: ml-service
        image: rootlens-ml:latest
        imagePullPolicy: IfNotPresent  
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PORT
          value: "5000"
        - name: FLASK_DEBUG
          value: "false"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: default
  labels:
    app: ml-service
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app: ml-service
