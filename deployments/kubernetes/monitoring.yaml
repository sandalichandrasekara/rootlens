apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rootlens-api
  namespace: default
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: rootlens-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      honorLabels: true
